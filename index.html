<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/favicon-32x32.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nieusync</title>
		<link
			rel="preload"
			href="/Magistral-Bold.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap"
			rel="stylesheet"
		/>
		<!-- Umami, self-hosted on nieusync-prod. No cookies and no personal
		     data, which is why this site carries no consent banner — see the
		     Cookie Policy. The website id is public by design; it identifies
		     the property, it does not authorise anything.

		     No route hook in the app: the tracker patches history.pushState,
		     so react-router navigations are counted on their own. -->
		<script
			defer
			src="https://analytics.nieusync.com/script.js"
			data-website-id="4c71573f-9fd6-43f9-82b6-79a59890e681"
		></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
